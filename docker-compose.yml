services:
  infisical-mcp:
    build: .
    image: infisical-mcp:local
    environment:
      INFISICAL_BASE_URL: ${INFISICAL_BASE_URL:-https://infisical-bfi.blueforceinnovations.com}
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_API_KEY: ${INFISICAL_API_KEY:-}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_ORGANIZATION_SLUG: ${INFISICAL_ORGANIZATION_SLUG:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-dev}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/}
      INFISICAL_TIMEOUT_SECONDS: ${INFISICAL_TIMEOUT_SECONDS:-30}
      INFISICAL_VERIFY_TLS: ${INFISICAL_VERIFY_TLS:-true}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-stdio}
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-8000}
    stdin_open: true
    tty: false
    ports:
      - "${MCP_PORT:-8000}:${MCP_PORT:-8000}"
